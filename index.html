<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions against distraction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Questions against distraction</h1>
            <div class="controls">
                <label for="interval">Cycle Interval (seconds):</label>
                <input type="number" id="interval" min="1" max="60" value="5">
                <button id="startBtn">Start (Spacebar)</button>
                <button id="stopBtn" disabled>Stop</button>
            </div>
        </div>
        
        <div class="sentence-display">
            <p id="currentSentence">Press spacebar or click Start to begin cycling through sentences</p>
        </div>
        
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>
        
        <div class="status">
            <span id="sentenceCounter">0 / 0</span>
            <span id="cycleStatus">Stopped</span>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
